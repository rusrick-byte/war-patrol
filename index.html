<!DOCTYPE html>
<html><head>
<meta charset="utf-8"/>
<title>WAR PATROL</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet"/>
<style>
html,body{height:100%;margin:0;background:#12160f;color:#1b1710;font-family:"IBM Plex Sans",sans-serif;user-select:none}
.stamp{font-family:"Special Elite",serif}
.mono{font-family:"IBM Plex Mono",monospace}
.app{height:100%;display:flex;flex-direction:column;background:#16140f}
.top{height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#2a271c;color:#cfc6a8;border-bottom:3px solid #8b1e14}
.top.alert{background:#6b1410;color:#ffe7c8;border-bottom-color:#e23;animation:pulse .7s infinite alternate}
@keyframes pulse{to{background:#3a0c0a}}
.screen{flex:1;min-height:0;display:grid;grid-template-columns:1.15fr .85fr;gap:8px;padding:8px}
.panel{background:#d8d0b4;border:1px solid #8a8060;box-shadow:inset 0 0 0 3px #eee6cc;display:flex;flex-direction:column;min-height:0}
.panel h2{margin:0;padding:6px 10px;font-size:12px;letter-spacing:.14em;background:#3f4a2e;color:#efe7c8}
canvas{flex:1;width:100%;min-height:0}
.bottom{display:grid;grid-template-columns:1fr 240px;gap:8px;padding:0 8px 8px;height:118px}
.coach,.board{background:#efe4b4;border:1px solid #8a8060;padding:8px 10px;overflow:hidden}
.board{background:#d8d0b4}
.btn{background:#efe7c8;border:1px solid #1b1710;padding:6px 12px;cursor:pointer}
.btn.p{background:#3f4a2e;color:#efe7c8}
.btn:disabled{opacity:.4;cursor:not-allowed}
.menu{height:100%;background:#1b1710;color:#cfc6a8;display:grid;grid-template-columns:1fr 1fr}
.menu-l,.menu-r{padding:40px}
.menu-l{border-right:1px solid #3a3428}
.overlay{position:absolute;inset:0;background:rgba(16,14,10,.82);display:flex;align-items:center;justify-content:center;z-index:5}
.card{width:min(580px,92vw);background:#d8d0b4;border:4px solid #1b1710;padding:24px}
.wrap{position:relative;height:100%}
.row{display:flex;justify-content:space-between;margin:3px 0;font-size:13px}
.banner{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:#8b1e14;color:#ffe7c8;padding:6px 18px;letter-spacing:.2em;display:none;z-index:4}
</style></head>
<body><div id="root" class="wrap"></div>
<script>
const A=(()=>{let c,m=0,mast,hum,hg,runO,runG,prop,pg;
function ac(){if(!c){c=new(window.AudioContext||window.webkitAudioContext)();mast=c.createGain();mast.gain.value=.22;mast.connect(c.destination)}if(c.state==="suspended")c.resume();return c}
function env(d,p){const g=ac().createGain(),t=ac().currentTime;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);g.connect(mast);return{g,t}}
function tone(ty,f,d,p){if(m)return;const o=ac().createOscillator();o.type=ty;o.frequency.value=f;const{g,t}=env(d,p);o.connect(g);o.start(t);o.stop(t+d+.02)}
function noise(d,p,f){if(m)return;const C=ac(),b=C.createBuffer(1,C.sampleRate*d,C.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=C.createBufferSource();s.buffer=b;const fl=C.createBiquadFilter();fl.type="lowpass";fl.frequency.value=f;const{g,t}=env(d,p);s.connect(fl);fl.connect(g);s.start(t)}
return{unlock:()=>ac(),toggle(){m=!m;if(m){this.hum(0);this.fish(0);this.props(0)}return m},muted:()=>m,
click:()=>tone("square",620,.06,.15),
dive(){if(m)return;const o=ac().createOscillator();o.type="sine";const{g,t}=env(.7,.12);o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(80,t+.7);o.connect(g);o.start(t);o.stop(t+.72)},
fire(){noise(.28,.3,500);const o=ac().createOscillator();o.type="sawtooth";const{g,t}=env(.4,.16);o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(40,t+.4);o.connect(g);o.start(t);o.stop(t+.42)},
boom(){noise(.85,.6,160);tone("sine",48,.9,.28)},
win(){[523,659,784].forEach((f,i)=>setTimeout(()=>tone("triangle",f,.25,.12),i*160))},
lose(){tone("sawtooth",90,.8,.2)},
klax(){if(m)return;[880,698,880,698].forEach((f,i)=>setTimeout(()=>tone("square",f,.18,.1),i*200))},
dc(){noise(.55,.7,220);tone("sine",42,.6,.3);setTimeout(()=>noise(.4,.35,140),180)},
fish(on){if(m)on=0;ac();if(on){if(runO)return;runO=ac().createOscillator();runO.type="sawtooth";runO.frequency.value=310;runG=ac().createGain();runG.gain.value=.04;const fl=ac().createBiquadFilter();fl.type="bandpass";fl.frequency.value=420;runO.connect(fl);fl.connect(runG);runG.connect(mast);runO.start()}else if(runO){try{runO.stop()}catch(e){}runO=null;runG=null}},
props(lv){if(m)lv=0;ac();if(!prop){const C=ac(),b=C.createBuffer(1,C.sampleRate,C.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;prop=C.createBufferSource();prop.buffer=b;prop.loop=true;const fl=C.createBiquadFilter();fl.type="lowpass";fl.frequency.value=280;pg=C.createGain();pg.gain.value=0;prop.connect(fl);fl.connect(pg);pg.connect(mast);prop.start()}const t=ac().currentTime;pg.gain.cancelScheduledValues(t);pg.gain.linearRampToValueAtTime(Math.max(0,lv)*.09,t+.15)},
hum(lv){if(m)lv=0;ac();if(!hum){hum=ac().createOscillator();hum.type="sine";hum.frequency.value=48;hg=ac().createGain();hg.gain.value=0;hum.connect(hg);hg.connect(mast);hum.start()}const t=ac().currentTime;hg.gain.cancelScheduledValues(t);hg.gain.linearRampToValueAtTime(Math.max(0,lv)*.04,t+.2)}
}})();
const TAU=Math.PI*2,KT=1.7,W=8000,Hgt=5000;
function dist(ax,ay,bx,by){return Math.hypot(bx-ax,by-ay)}
function ad(a,b){let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function homeCue(){
 const want=Math.atan2(g.home[1]-g.py,g.home[0]-g.px);
 const a=ad(want,g.hd);
 if(Math.abs(a)<.22) return "HOME DEAD AHEAD \u2014 hold this heading";
 if(a>0) return a>1.15?"HOME ASTERN TO STARBOARD \u2014 come right (D)":"HOME OFF STARBOARD BOW \u2014 D";
 return a<-1.15?"HOME ASTERN TO PORT \u2014 come left (A)":"HOME OFF PORT BOW \u2014 A";
}
const LS="wp_unlock_v2";
let unlocked=1;
try{unlocked=Math.max(1,JSON.parse(localStorage.getItem(LS)||"1"))}catch(e){}
function saveUnlock(n){unlocked=Math.max(unlocked,n);try{localStorage.setItem(LS,String(unlocked))}catch(e){}}
const M=[
 {id:0,title:"SAN DIEGO SHAKEDOWN",night:0,train:1,start:[1400,2600,-.2],
  land:[[[0,0],[2200,0],[2000,700],[900,1100],[0,1800]],"POINT LOMA"],
  ships:[{k:"hulk",n:"TARGET HULK",x:3100,y:2100,h:.4,sp:0,len:140,hp:1,wp:[]}]},
 {id:1,title:"FIRST WAR PATROL",night:0,train:0,start:[900,3200,.15],
  land:[[[0,0],[8000,0],[8000,500],[4000,400],[0,600]],"COAST"],
  ships:[{k:"merch",n:"NITTO MARU",x:2400,y:1700,h:.1,sp:11,len:160,hp:2,wp:[[2400,1700],[5600,1900],[7400,1600]]}]},
 {id:2,title:"SECOND WAR PATROL",night:0,train:0,start:[800,3600,.35],
  land:[[[0,0],[8000,0],[8000,420],[2400,380],[0,520]],"HONSHU"],
  ships:[
   {k:"tank",n:"TEIYO MARU",x:2500,y:1550,h:.05,sp:9,len:190,hp:3,wp:[[2500,1550],[5000,1700],[7200,1550]]},
   {k:"merch",n:"PACIFIC MARU",x:2200,y:1800,h:.05,sp:9,len:150,hp:2,wp:[[2200,1800],[4700,1950],[7000,1800]]},
   {k:"dd",n:"DD HIBIKI",x:2900,y:1450,h:.05,sp:15,len:110,hp:2,wp:[[2900,1450],[5400,1500],[7400,1400]]}
  ]},
 {id:3,title:"NIGHT SURFACE ATTACK",night:1,train:0,start:[1000,2800,.2],
  land:[[[0,0],[1600,0],[1200,2200],[0,2800]],"COAST"],
  ships:[
   {k:"tank",n:"KYOKUTO MARU",x:3000,y:1400,h:-.1,sp:8,len:190,hp:3,wp:[[3000,1400],[5200,1250],[7300,1400]]},
   {k:"dd",n:"CD-22",x:3300,y:1250,h:-.1,sp:14,len:100,hp:2,wp:[[3300,1250],[5500,1100],[7500,1250]]}
  ]}
];
const input={l:0,r:0,q:0,e:0};
let phase="menu",idx=0,g=null,cv1,cv2,last=0;
function boot(i){
 const d=M[i];idx=i;
 g={def:d,t:0,px:d.start[0],py:d.start[1],hd:d.start[2],st:"surface",
    sb:0,fish:d.train?4:6,cd:0,fs:[],dcs:[],coach:d.train?"TURN THE BOAT \u2014 hold A or D.":"Barn mark is already on the chart. R / RTB runs for it. Keep a fish if you want teeth.",
    drill:0,status:"play",mode:"hunt",sunk:0,hits:0,bhp:3,compress:d.train?1:4,dryTold:0,
    home:[d.start[0],d.start[1]],
    ships:d.ships.map((s,n)=>({...s,id:n,alive:1,wi:0,maxHp:s.hp,hunt:0}))};
 A.unlock();A.fish(0);phase="play";drawUI();last=performance.now();loop(last);
}
function preyLeft(){return g.ships.filter(s=>s.k!=="dd"&&s.alive).length}
function damagedList(){return g.ships.filter(s=>s.hp<s.maxHp).map(s=>s.n+(s.alive?" (damaged)":" (sunk)"))}
function setAlert(on){
 const top=document.querySelector(".top"),b=document.getElementById("banner");
 if(top)top.classList.toggle("alert",!!on);
 if(b)b.style.display=on?"block":"none";
}
function endPatrol(kind,reason){
 if(!g||g.status!=="play")return;
 g.status=kind;g.reason=reason;g.mode="done";setAlert(0);A.fish(0);A.props(0);
 if(kind==="won"){A.win();saveUnlock(idx+2);} else A.lose();
 setTimeout(function(){phase="win";A.hum(0);drawUI();},800);
}
function spawnHunter(){
 let dd=g.ships.find(s=>s.k==="dd"&&s.alive);
 if(!dd){
  const side=g.px>4000?-1:1;
  dd={k:"dd",n:"DD INCOMING",x:g.px+side*900,y:g.py-400,h:0,sp:18,len:110,hp:2,maxHp:2,wp:[],alive:1,wi:0,hunt:1,id:99};
  g.ships.push(dd);
 }
 dd.hunt=1;dd.sp=Math.max(dd.sp,17);
}
function startRun(){
 if(!g||g.status!=="play"||g.mode==="run")return;
 if(g.def.train){endPatrol(g.sunk?"won":"home",g.sunk?"Hulk is on the bottom.":"Range safety called it.");return;}
 g.mode="run";spawnHunter();A.klax();
 const teeth=g.fish>0?(" You kept "+g.fish+" fish \u2014 put the wire on the can and ENTER."):" Tubes dry. Hide.";
 g.coach=homeCue()+". Red barn mark on the chart."+teeth;
 setAlert(1);
}
function rtb(){
 if(!g||g.status!=="play")return;
 if(g.mode==="run")return;
 if(preyLeft()===0) endPatrol("won","Targets down. Make for the barn.");
 else startRun();
}
function fire(){
 if(!g||g.status!=="play"||g.cd>0||g.fish<=0||g.st==="deep")return;
 const course=g.hd+g.sb;g.fish--;g.cd=7;
 g.fs.push({x:g.px+Math.cos(course)*30,y:g.py+Math.sin(course)*30,h:course,life:28,tr:[]});
 A.fire();A.fish(1);
 g.coach=g.mode==="run"?"Insurance fish is running.":(g.fish<=0?"Last fish is running.":(g.def.train?"WATCH THE WAKE.":"Fish running. "+g.fish+" left."));
}
function loop(now){
 if(phase!=="play")return;
 requestAnimationFrame(loop);
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(!g||g.status!=="play")return;
 const step=dt*g.compress;
 g.t+=dt;g.cd=Math.max(0,g.cd-dt);
 if(input.l)g.hd-=.65*dt;if(input.r)g.hd+=.65*dt;
 if(input.q)g.sb-=.9*dt;if(input.e)g.sb+=.9*dt;
 const spd=(g.st==="surface"?16:g.st==="scope"?6:3.5)*KT;
 g.px=clamp(g.px+Math.cos(g.hd)*spd*step,80,W-80);
 g.py=clamp(g.py+Math.sin(g.hd)*spd*step,80,Hgt-80);
 const hunter=g.ships.find(s=>s.alive&&(s.hunt||(g.mode==="run"&&s.k==="dd")));
 const hd=hunter?dist(g.px,g.py,hunter.x,hunter.y):9999;
 A.hum(g.st==="surface"?.9:g.st==="scope"?.45:.18);
 A.props((g.st==="surface"?0.7:0.25)+(hunter&&hd<700?0.6:0));
 if(g.def.train&&g.drill===0&&(input.l||input.r)){g.drill=1;g.coach="GOOD. F = scope depth when the hulk is ahead.";}
 for(const s of g.ships){
  if(!s.alive)continue;
  if(s.hunt||(g.mode==="run"&&s.k==="dd")){
   const want=Math.atan2(g.py-s.y,g.px-s.x);
   s.h+=clamp(ad(want,s.h),-.55*step,.55*step);
   s.sp=g.st==="deep"?14:19;
  } else if(s.wp.length){
   const w=s.wp[s.wi%s.wp.length];
   if(dist(s.x,s.y,w[0],w[1])<90)s.wi++;
   const want=Math.atan2(w[1]-s.y,w[0]-s.x);
   s.h+=clamp(ad(want,s.h),-.3*step,.3*step);
  }
  s.x=clamp(s.x+Math.cos(s.h)*s.sp*KT*step,60,W-60);
  s.y=clamp(s.y+Math.sin(s.h)*s.sp*KT*step,60,Hgt-60);
 }
 for(const f of g.fs){
  f.life-=dt;f.x+=Math.cos(f.h)*42*KT*dt;f.y+=Math.sin(f.h)*42*KT*dt;f.tr.push([f.x,f.y]);if(f.tr.length>18)f.tr.shift();
  for(const s of g.ships){
   if(!s.alive)continue;
   if(dist(f.x,f.y,s.x,s.y)<Math.max(26,s.len*.26)){
    f.life=0;s.hp--;g.hits++;A.boom();
    if(s.hp<=0){s.alive=0;g.sunk++;g.coach=s.k==="dd"?"Can is breaking up. Steer for the barn mark.":s.n+" is breaking up.";}
    else g.coach="Hit on "+s.n+". Still making turns.";
   }
  }
 }
 g.fs=g.fs.filter(f=>f.life>0);
 if(!g.fs.length)A.fish(0);
 for(const d of g.dcs){
  d.t+=dt;
  if(!d.boom&&d.t>.8){
   d.boom=1;A.dc();
   const r=dist(g.px,g.py,d.x,d.y);
   const deep=g.st==="deep";
   if(r<(deep?70:140)){g.bhp--;g.coach=deep?"Close charge. Hull ringing.":"CHARGE CLOSE ABOARD \u2014 DIVE (C)!";}
  }
 }
 g.dcs=g.dcs.filter(d=>d.t<2.2);
 if(g.mode!=="run" && (g.def.train?g.sunk>=1:preyLeft()===0)){
  endPatrol("won",g.def.train?"Hulk is on the bottom. You are a skipper now.":"Targets down. Make for the barn.");
 } else if(g.mode!=="run" && g.fish<=0 && g.fs.length===0 && !g.dryTold){
  g.dryTold=1;g.coach="Bow room empty. R or RTB \u2014 follow the red line to the barn.";
 }
 if(g.mode==="run"){
  setAlert(1);
  if(g.t%2<dt*g.compress+0.05) g.coach=homeCue()+(g.fish?" \u00b7 "+g.fish+" fish left.":"");
  if(hunter&&hd<420&&(!g.nextDc||g.t>g.nextDc)){
   g.nextDc=g.t+2.4;
   g.dcs.push({x:g.px+Math.cos(g.hd)*40,y:g.py+Math.sin(g.hd)*40,t:0,boom:0});
   g.coach="DEPTH CHARGE IN THE WATER \u2014 C to go deep. "+homeCue();
  }
  if(dist(g.px,g.py,g.home[0],g.home[1])<220){
   endPatrol(g.sunk>0||g.hits>0?"won":"home", g.sunk?"You made the barn with kills on the board.":"You made the barn. Empty book, whole boat.");
  }
  if(g.bhp<=0) endPatrol("lost","Charges walked down the track. Boat is gone.");
 }
 paint();
}
function aspectWords(g,s){
 const los=Math.atan2(s.y-g.py,s.x-g.px);
 const asp=Math.abs(ad(s.h,los));
 const beam=Math.min(asp,Math.PI-asp);
 if(beam<0.35) return asp<Math.PI/2?"BOW ON":"STERN ON";
 if(beam>1.2) return "BEAM ON";
 return "QUARTER";
}
function paint(){
 const c=cv1,s=cv2;if(!c||!s||!g)return;
 const dpr=devicePixelRatio||1;
 function prep(cv){cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;return cv.getContext("2d")}
 const ctx=prep(c),w=c.width,h=c.height;
 const sc=Math.min(w/4200,h/3000)*(g.compress>=16?.72:1);
 const ox=w/2-g.px*sc,oy=h/2-g.py*sc,X=x=>ox+x*sc,Y=y=>oy+y*sc;
 ctx.fillStyle=g.def.night?"#0d1820":"#b7c4b0";ctx.fillRect(0,0,w,h);
 ctx.fillStyle=g.def.night?"#1a2a22":"#8a9a6e";
 ctx.beginPath();g.def.land[0].forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));ctx.closePath();ctx.fill();
 ctx.strokeStyle=g.mode==="run"?"#8b1e14":"rgba(139,30,20,.45)";
 ctx.setLineDash([8,6]);ctx.lineWidth=g.mode==="run"?2:1;
 ctx.beginPath();ctx.moveTo(X(g.px),Y(g.py));ctx.lineTo(X(g.home[0]),Y(g.home[1]));ctx.stroke();ctx.setLineDash([]);
 ctx.beginPath();ctx.arc(X(g.home[0]),Y(g.home[1]),16,0,TAU);ctx.stroke();
 ctx.fillStyle="#8b1e14";
 ctx.font=12*dpr+'px "Special Elite"';
 ctx.fillText("BARN / HOME",X(g.home[0])+18,Y(g.home[1])-4);
 ctx.font=10*dpr+"px monospace";
 ctx.fillText(Math.round(dist(g.px,g.py,g.home[0],g.home[1]))+" yd",X(g.home[0])+18,Y(g.home[1])+12);
 for(const sh of g.ships){
  if(!sh.alive){ctx.fillStyle="rgba(40,40,40,.5)";ctx.beginPath();ctx.arc(X(sh.x),Y(sh.y),5,0,TAU);ctx.fill();continue;}
  ctx.save();ctx.translate(X(sh.x),Y(sh.y));ctx.rotate(sh.h);
  ctx.fillStyle=sh.k==="dd"?"#7a1f1f":sh.k==="tank"?"#2c3a28":"#243044";
  ctx.fillRect(-10,-3.5,20,7);ctx.restore();
 }
 ctx.strokeStyle="#c45a2a";ctx.lineWidth=2;
 for(const f of g.fs){if(f.tr.length<2)continue;ctx.beginPath();f.tr.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));ctx.stroke()}
 for(const d of g.dcs){
  ctx.strokeStyle=d.boom?"rgba(180,40,20,.7)":"rgba(40,40,40,.4)";
  ctx.beginPath();ctx.arc(X(d.x),Y(d.y),8+d.t*40,0,TAU);ctx.stroke();
 }
 ctx.save();ctx.translate(X(g.px),Y(g.py));ctx.rotate(g.hd+Math.PI/2);
 ctx.fillStyle="#1a140c";ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(7,10);ctx.lineTo(0,6);ctx.lineTo(-7,10);ctx.fill();ctx.restore();
 const coach=document.getElementById("coach");if(coach)coach.textContent=g.coach;
 const fishEl=document.getElementById("fish");if(fishEl)fishEl.textContent="FISH "+g.fish;
 const hpEl=document.getElementById("hp");if(hpEl)hpEl.textContent="HULL "+g.bhp;
 const cht=document.getElementById("cht");if(cht)cht.textContent=(g.mode==="run"?"RUN \u00b7 ":"CHART \u00b7 ")+g.compress+"\u00d7";
 const homeR=Math.round(dist(g.px,g.py,g.home[0],g.home[1]));
 if(g.mode==="run"){
  if(document.getElementById("tgt"))document.getElementById("tgt").textContent="BARN";
  if(document.getElementById("rng"))document.getElementById("rng").textContent=homeR+" yd";
  if(document.getElementById("asp"))document.getElementById("asp").textContent=homeCue().split(" \u2014 ")[0];
 } else {
  const marked=g.ships.find(sh=>sh.alive&&Math.abs(ad(Math.atan2(sh.y-g.py,sh.x-g.px),g.hd+g.sb))<.16);
  if(document.getElementById("tgt"))document.getElementById("tgt").textContent=marked?marked.n:"\u2014";
  if(document.getElementById("rng"))document.getElementById("rng").textContent=marked?Math.round(dist(g.px,g.py,marked.x,marked.y))+" yd":"\u2014";
  if(document.getElementById("asp"))document.getElementById("asp").textContent=marked?aspectWords(g,marked):"\u2014";
 }
 const sx=prep(s),sw=s.width,shH=s.height,cx=sw/2,cy=shH*.58,R=Math.min(sw,shH)*.46;
 sx.fillStyle="#0a0c0b";sx.fillRect(0,0,sw,shH);
 sx.save();sx.beginPath();sx.arc(cx,cy,R,0,TAU);sx.clip();
 const hor=cy-R*.08;
 sx.fillStyle=g.def.night?"#0b1220":g.st==="deep"?"#021018":"#6f92a8";
 sx.fillRect(cx-R,cy-R,R*2,hor-(cy-R));
 sx.fillStyle=g.def.night?"#071018":g.st==="deep"?"#021018":"#2a4a55";
 sx.fillRect(cx-R,hor,R*2,R*2);
 if(g.st!=="deep"){
  const wire=g.hd+g.sb,fov=.84;
  const list=g.ships.filter(sh=>sh.alive).map(sh=>{
   const tgt=Math.atan2(sh.y-g.py,sh.x-g.px);let a=tgt-wire;while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;
   return {sh,a,d:dist(g.px,g.py,sh.x,sh.y)};
  }).filter(o=>Math.abs(o.a)<fov/2+.1&&o.d<5200).sort((a,b)=>b.d-a.d);
  for(const o of list){
   const x=cx+(o.a/(fov/2))*R*.92;
   const los=Math.atan2(o.sh.y-g.py,o.sh.x-g.px);
   const asp=ad(o.sh.h,los);
   const beam=Math.abs(Math.sin(asp));
   const bow=Math.abs(Math.cos(asp));
   const base=Math.max(10,(o.sh.len*210)/o.d);
   const hullW=base*(.22+.78*beam);
   const hullH=base*(.16+.10*bow);
   const keel=hor+Math.min(36,o.d/90);
   sx.fillStyle=o.sh.k==="dd"?"#3a1010":"#141414";
   sx.fillRect(x-hullW/2,keel-hullH,hullW,hullH);
   const stack=bow>0.7?(asp>0?-hullW*.18:hullW*.18):0;
   sx.fillRect(x-hullW*.08+stack,keel-hullH-base*.18,Math.max(3,hullW*.12),base*.18);
   if(Math.abs(o.a)<.07){
    sx.fillStyle="#d4c27a";sx.font=9*dpr+"px monospace";sx.textAlign="center";
    sx.fillText(o.sh.n,x,keel-hullH-base*.28);
    sx.fillText(aspectWords(g,o.sh),x,keel+14*dpr);
   }
  }
 }
 sx.restore();
 sx.strokeStyle="rgba(210,190,130,.55)";sx.beginPath();sx.moveTo(cx,cy-R+8);sx.lineTo(cx,cy+R-8);sx.stroke();
}
function drawUI(){
 const root=document.getElementById("root");
 if(phase==="menu"){
  root.innerHTML=`<div class="menu"><div class="menu-l">
   <div class="stamp" style="color:#c9a227;font-size:13px">PACIFIC FLEET</div>
   <div class="stamp" style="font-size:56px;line-height:.95">WAR PATROL</div>
   <p>The red barn mark is home. Follow the dashed line. Keep a fish for the can if you want teeth on the run.</p>
  </div><div class="menu-r">
   <div class="stamp" style="margin-bottom:12px">SAILING BOARD</div>
   ${M.map((p,i)=>{
     const lock=i>=unlocked;
     return `<button class="btn" ${lock?"disabled":""} data-i="${i}" style="display:block;width:100%;text-align:left;margin:0 0 8px">
      <b>${String(i).padStart(2,"0")} \u00b7 ${p.title}</b>
      <div style="font-size:11px">${lock?"Sink the previous target first":(p.train?"Training hulk":p.night?"Night surface":"War patrol")}</div>
     </button>`;
   }).join("")}
  </div></div>`;
  root.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{A.unlock();A.click();boot(+b.dataset.i)});
  return;
 }
 if(phase==="win"){
  const nxt=idx+1<M.length?idx+1:-1;
  const ok=g.status==="won";
  const dead=g.status==="lost";
  const dmg=damagedList();
  root.innerHTML=`<div class="overlay"><div class="card">
   <div class="stamp" style="font-size:28px;color:${dead?"#8b1e14":ok?"#3f4a2e":"#6b4a1e"}">${dead?"OVERDUE":ok?"PATROL REPORT":"RETURNED TO BASE"}</div>
   <p>${g.reason||""}</p>
   <p class="mono">Sunk ${g.sunk} \u00b7 hits ${g.hits} \u00b7 hull ${g.bhp} \u00b7 fish left ${g.fish}</p>
   ${dmg.length?'<p style="font-size:13px">'+dmg.join(" \u00b7 ")+'</p>':''}
   <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
    <button class="btn p" id="again">Run it again</button>
    ${ok&&nxt>=0?'<button class="btn p" id="next">Next patrol</button>':''}
    <button class="btn" id="board">Sailing board</button>
   </div></div></div>`;
  document.getElementById("again").onclick=()=>boot(idx);
  const n=document.getElementById("next");if(n)n.onclick=()=>boot(nxt);
  document.getElementById("board").onclick=()=>{phase="menu";drawUI()};
  return;
 }
 root.innerHTML=`<div class="app">
  <div class="top"><div class="stamp">${g.def.title}</div>
   <div class="mono" id="cht" style="margin-left:auto">CHART</div>
   <div class="mono" id="hp">HULL 3</div>
   <div class="mono" id="fish">FISH ${g.fish}</div>
   <button class="btn" id="rtb">RTB</button>
   <button class="btn" id="mu">${A.muted()?"SND OFF":"SND ON"}</button>
  </div>
  <div class="banner stamp" id="banner">DESTROYER HUNTING \u2014 FOLLOW THE RED LINE HOME</div>
  <div class="screen">
   <div class="panel"><h2>NAVIGATIONAL CHART</h2><canvas id="c1"></canvas></div>
   <div class="panel"><h2>${g.def.night?"NIGHT GLASS":"PERISCOPE"}</h2><canvas id="c2"></canvas></div>
  </div>
  <div class="bottom">
   <div class="coach stamp" id="coach"></div>
   <div class="board">
    <div class="row"><span>Target</span><b id="tgt">\u2014</b></div>
    <div class="row"><span>Range</span><b class="mono" id="rng">\u2014</b></div>
    <div class="row"><span>Cue</span><b class="mono" id="asp">\u2014</b></div>
   </div>
  </div>
 </div>`;
 cv1=document.getElementById("c1");cv2=document.getElementById("c2");
 document.getElementById("mu").onclick=()=>{A.toggle();document.getElementById("mu").textContent=A.muted()?"SND OFF":"SND ON"};
 document.getElementById("rtb").onclick=()=>{A.click();rtb();};
}
window.onkeydown=e=>{
 A.unlock();
 const k=e.key.toLowerCase();
 if(phase!=="play"||!g)return;
 if(k==="a"||k==="arrowleft")input.l=1;
 if(k==="d"||k==="arrowright")input.r=1;
 if(k==="q")input.q=1;if(k==="e")input.e=1;
 if(k==="f"){g.st="scope";A.dive();}
 if(k==="c"){g.st="deep";A.dive();if(g.mode==="run")g.coach="Deep. Slow. "+homeCue();}
 if(k==="v")g.st="surface";
 if(k==="z")g.compress=g.compress===64?16:g.compress===16?4:1;
 if(k==="x")g.compress=g.compress===1?4:g.compress===4?16:64;
 if(k==="enter"){fire();e.preventDefault()}
 if(k==="r"){rtb();e.preventDefault()}
 if(k==="m"){A.toggle();const b=document.getElementById("mu");if(b)b.textContent=A.muted()?"SND OFF":"SND ON"}
};
window.onkeyup=e=>{
 const k=e.key.toLowerCase();
 if(k==="a"||k==="arrowleft")input.l=0;
 if(k==="d"||k==="arrowright")input.r=0;
 if(k==="q")input.q=0;if(k==="e")input.e=0;
};
drawUI();
</script></body></html>
