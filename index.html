<!DOCTYPE html>
<html><head>
<meta charset="utf-8"/>
<title>WAR PATROL</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet"/>
<style>
html,body{height:100%;margin:0;background:#12160f;color:#1b1710;font-family:"IBM Plex Sans",sans-serif;user-select:none}
.stamp{font-family:"Special Elite",serif}
.mono{font-family:"IBM Plex Mono",monospace}
.app{height:100%;display:flex;flex-direction:column;background:#16140f}
.top{height:48px;display:flex;align-items:center;gap:12px;padding:0 12px;background:#2a271c;color:#cfc6a8;border-bottom:3px solid #8b1e14}
.screen{flex:1;min-height:0;display:grid;grid-template-columns:1.15fr .85fr;gap:8px;padding:8px}
.panel{background:#d8d0b4;border:1px solid #8a8060;box-shadow:inset 0 0 0 3px #eee6cc;display:flex;flex-direction:column;min-height:0}
.panel h2{margin:0;padding:6px 10px;font-size:12px;letter-spacing:.14em;background:#3f4a2e;color:#efe7c8}
canvas{flex:1;width:100%;min-height:0}
.coach{height:120px;margin:0 8px 8px;background:#efe4b4;border:1px solid #8a8060;padding:10px}
.btn{background:#efe7c8;border:1px solid #1b1710;padding:6px 12px;cursor:pointer}
.btn.p{background:#3f4a2e;color:#efe7c8}
.menu{height:100%;background:#1b1710;color:#cfc6a8;padding:48px}
.overlay{position:absolute;inset:0;background:rgba(16,14,10,.82);display:flex;align-items:center;justify-content:center}
.card{width:min(560px,92vw);background:#d8d0b4;border:4px solid #1b1710;padding:24px}
.wrap{position:relative;height:100%}
</style></head>
<body><div id="root" class="wrap"></div>
<script>
const A=(()=>{let c,m=0,mast,hum,hg,al;
function ac(){if(!c){c=new(window.AudioContext||window.webkitAudioContext)();mast=c.createGain();mast.gain.value=.22;mast.connect(c.destination)}if(c.state==="suspended")c.resume();return c}
function env(d,p){const g=ac().createGain(),t=ac().currentTime;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);g.connect(mast);return{g,t}}
function tone(ty,f,d,p){if(m)return;const o=ac().createOscillator();o.type=ty;o.frequency.value=f;const{g,t}=env(d,p);o.connect(g);o.start(t);o.stop(t+d+.02)}
function noise(d,p,f){if(m)return;const C=ac(),b=C.createBuffer(1,C.sampleRate*d,C.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=C.createBufferSource();s.buffer=b;const fl=C.createBiquadFilter();fl.type="lowpass";fl.frequency.value=f;const{g,t}=env(d,p);s.connect(fl);fl.connect(g);s.start(t)}
return{unlock:()=>ac(),toggle(){m=!m;if(m)this.hum(0);return m},muted:()=>m,
click:()=>tone("square",620,.06,.15),
dive(){if(m)return;const o=ac().createOscillator();o.type="sine";const{g,t}=env(.7,.12);o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(80,t+.7);o.connect(g);o.start(t);o.stop(t+.72)},
fire(){noise(.35,.35,400);const o=ac().createOscillator();o.type="sawtooth";const{g,t}=env(.55,.18);o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(40,t+.55);o.connect(g);o.start(t);o.stop(t+.57)},
boom(){noise(.7,.55,180);tone("sine",55,.8,.25)},
win(){[523,659,784].forEach((f,i)=>setTimeout(()=>tone("triangle",f,.25,.12),i*160))},
hum(lv){if(m)lv=0;ac();if(!hum){hum=ac().createOscillator();hum.type="sine";hum.frequency.value=48;hg=ac().createGain();hg.gain.value=0;hum.connect(hg);hg.connect(mast);hum.start()}const t=ac().currentTime;hg.gain.cancelScheduledValues(t);hg.gain.linearRampToValueAtTime(Math.max(0,lv)*.045,t+.2)}
}})();
const TAU=Math.PI*2,KT=1.7,W=8000,H=5000;
const land=[{l:"POINT LOMA",p:[[0,0],[2200,0],[2000,700],[1600,900],[900,1100],[400,1600],[0,1800]]}];
function dist(a,b,c,d){return Math.hypot(c-a,d-b)}
function ad(a,b){let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d}
const input={l:0,r:0,q:0,e:0};
let phase="menu",g=null,cv1,cv2,last=0;
function boot(){
 g={t:0,px:1400,py:2600,hd:-.2,st:"surface",sb:0,fish:4,cd:0,hx:3100,hy:2100,alive:1,hp:1,fs:[],coach:"TURN THE BOAT — hold A or D.",drill:0,status:"play"};
 A.unlock();phase="play";drawUI();last=performance.now();loop(last);
}
function fire(){
 if(g.status!=="play"||g.cd>0||g.fish<=0||g.st==="deep")return;
 const course=g.hd+g.sb;g.fish--;g.cd=7;
 g.fs.push({x:g.px+Math.cos(course)*30,y:g.py+Math.sin(course)*30,h:course,life:28,tr:[]});
 A.fire();g.coach="WATCH THE WAKE on the chart.";
}
function loop(now){
 if(phase!=="play")return;
 requestAnimationFrame(loop);
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(!g||g.status!=="play")return;
 g.t+=dt;g.cd=Math.max(0,g.cd-dt);
 if(input.l)g.hd-=.7*dt;if(input.r)g.hd+=.7*dt;
 if(input.q)g.sb-=.9*dt;if(input.e)g.sb+=.9*dt;
 const spd=(g.st==="surface"?16:g.st==="scope"?6:3.5)*KT;
 g.px=Math.max(80,Math.min(W-80,g.px+Math.cos(g.hd)*spd*dt));
 g.py=Math.max(80,Math.min(H-80,g.py+Math.sin(g.hd)*spd*dt));
 A.hum(g.st==="surface"?.9:g.st==="scope"?.45:.2);
 if(g.drill===0&&(input.l||input.r)){g.drill=1;g.coach="GOOD. F = scope depth when the hulk is ahead.";}
 const tgt=Math.atan2(g.hy-g.py,g.hx-g.px);
 if(Math.abs(ad(tgt,g.hd+g.sb))<.18&&dist(g.px,g.py,g.hx,g.hy)<5000&&g.drill<3&&g.alive){g.drill=3;g.coach="ON THE WIRE. ENTER fires one fish.";}
 for(const f of g.fs){
  f.life-=dt;f.x+=Math.cos(f.h)*42*KT*dt;f.y+=Math.sin(f.h)*42*KT*dt;f.tr.push([f.x,f.y]);if(f.tr.length>18)f.tr.shift();
  if(g.alive&&dist(f.x,f.y,g.hx,g.hy)<40){
    f.life=0;g.alive=0;A.boom();A.win();
    g.coach="Hulk is on the bottom. Range safety is on the horn.";
    setTimeout(function(){ phase="win"; A.hum(0); drawUI(); }, 900);
  }
 }
 g.fs=g.fs.filter(f=>f.life>0);
 paint();
}
function paint(){
 const c=cv1,s=cv2;if(!c||!s)return;
 const dpr=devicePixelRatio||1;
 function prep(cv){cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;return cv.getContext("2d")}
 const ctx=prep(c),w=c.width,h=c.height;
 const sc=Math.min(w/4200,h/3000),ox=w/2-g.px*sc,oy=h/2-g.py*sc;
 const X=x=>ox+x*sc,Y=y=>oy+y*sc;
 ctx.fillStyle="#b7c4b0";ctx.fillRect(0,0,w,h);
 ctx.fillStyle="#8a9a6e";ctx.beginPath();land[0].p.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));ctx.closePath();ctx.fill();
 if(g.alive){ctx.fillStyle="#243044";ctx.fillRect(X(g.hx)-8,Y(g.hy)-3,16,6)}
 else {ctx.fillStyle="rgba(40,40,40,.55)";ctx.beginPath();ctx.arc(X(g.hx),Y(g.hy),7,0,TAU);ctx.fill()}
 ctx.strokeStyle="#c45a2a";ctx.lineWidth=2;
 for(const f of g.fs){if(f.tr.length<2)continue;ctx.beginPath();f.tr.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));ctx.stroke()}
 ctx.save();ctx.translate(X(g.px),Y(g.py));ctx.rotate(g.hd+Math.PI/2);
 ctx.fillStyle="#1a140c";ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(7,10);ctx.lineTo(0,6);ctx.lineTo(-7,10);ctx.fill();ctx.restore();
 const coach=document.getElementById("coach"); if(coach) coach.textContent=g.coach;
 const fishEl=document.getElementById("fish"); if(fishEl) fishEl.textContent="FISH "+g.fish;
 const sx=prep(s),sw=s.width,sh=s.height,cx=sw/2,cy=sh*.58,R=Math.min(sw,sh)*.46;
 sx.fillStyle="#0a0c0b";sx.fillRect(0,0,sw,sh);
 sx.save();sx.beginPath();sx.arc(cx,cy,R,0,TAU);sx.clip();
 const hor=cy-R*.08;
 sx.fillStyle=g.st==="deep"?"#021018":"#6f92a8";sx.fillRect(cx-R,cy-R,R*2,hor-(cy-R));
 sx.fillStyle=g.st==="deep"?"#021018":"#2a4a55";sx.fillRect(cx-R,hor,R*2,R*2);
 if(g.st!=="deep"&&g.alive){
  const wire=g.hd+g.sb,tgt=Math.atan2(g.hy-g.py,g.hx-g.px);let a=tgt-wire;while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;
  const d=dist(g.px,g.py,g.hx,g.hy);
  if(Math.abs(a)<.5&&d<5200){const x=cx+(a/.42)*R*.92,sz=Math.max(8,140*220/d);sx.fillStyle="#141414";sx.fillRect(x-sz/2,hor+10,sz,sz*.28);if(Math.abs(a)<.06){sx.fillStyle="#d4c27a";sx.font=9*dpr+"px monospace";sx.textAlign="center";sx.fillText("TARGET HULK",x,hor)}}
 }
 sx.restore();
 sx.strokeStyle="rgba(210,190,130,.55)";sx.beginPath();sx.moveTo(cx,cy-R+8);sx.lineTo(cx,cy+R-8);sx.stroke();
}
function drawUI(){
 const root=document.getElementById("root");
 if(phase==="menu"){
  root.innerHTML=`<div class="menu"><div class="stamp" style="color:#c9a227">PACIFIC FLEET</div>
  <div class="stamp" style="font-size:56px;line-height:.95">WAR PATROL</div>
  <p>Shakedown + sound. A/D helm, F scope, Q/E glass, ENTER shoot, M mute.</p>
  <button class="btn p" id="go">Take her out</button></div>`;
  document.getElementById("go").onclick=()=>{A.click();boot()};
  return;
 }
 if(phase==="win"){
  root.innerHTML=`<div class="overlay"><div class="card"><div class="stamp" style="font-size:28px">PATROL REPORT</div>
  <p>Hulk is on the bottom. You are a skipper now.</p>
  <p class="mono">1 ship · training fish expended</p>
  <button class="btn p" id="again">Run it again</button></div></div>`;
  document.getElementById("again").onclick=()=>{phase="menu";drawUI()};
  return;
 }
 root.innerHTML=`<div class="app">
  <div class="top"><div class="stamp">USS WAHOO</div><div class="mono">SHAKEDOWN</div>
  <div class="mono" id="fish" style="margin-left:auto">FISH 4</div>
  <button class="btn" id="mu">SND ON</button></div>
  <div class="screen">
   <div class="panel"><h2>CHART</h2><canvas id="c1"></canvas></div>
   <div class="panel"><h2>PERISCOPE</h2><canvas id="c2"></canvas></div>
  </div>
  <div class="coach stamp" id="coach"></div>
 </div>`;
 cv1=document.getElementById("c1");cv2=document.getElementById("c2");
 document.getElementById("mu").onclick=()=>{A.toggle();document.getElementById("mu").textContent=A.muted()?"SND OFF":"SND ON"};
}
window.onkeydown=e=>{
 A.unlock();
 const k=e.key.toLowerCase();
 if(k==="a"||k==="arrowleft")input.l=1;
 if(k==="d"||k==="arrowright")input.r=1;
 if(k==="q")input.q=1;if(k==="e")input.e=1;
 if(k==="f"&&g){g.st="scope";A.dive();if(g.drill<2){g.drill=2;g.coach="SWING THE SCOPE — Q and E. Put the wire on the hulk."}}
 if(k==="c"&&g)g.st="deep";
 if(k==="v"&&g)g.st="surface";
 if(k==="enter"&&g){fire();e.preventDefault()}
 if(k==="m"){A.toggle();const b=document.getElementById("mu");if(b)b.textContent=A.muted()?"SND OFF":"SND ON"}
};
window.onkeyup=e=>{
 const k=e.key.toLowerCase();
 if(k==="a"||k==="arrowleft")input.l=0;
 if(k==="d"||k==="arrowright")input.r=0;
 if(k==="q")input.q=0;if(k==="e")input.e=0;
};
drawUI();
</script></body></html>
